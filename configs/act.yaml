dataset:
  task: door_push_alex_v2
  space: A2_ee_delta
  version: v2_pose
  view_id: null                   # optional split/stat view over one physical version
  obs_preset: core

model:
  chunk_size: 40
  d_model: 128
  n_heads: 4
  dim_feedforward: 512
  z_dim: 16
  cvae_encoder_layers: 2
  encoder_layers: 2
  decoder_layers: 2
  dropout: 0.1

train:
  epochs: 100
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  kl_weight: 10.0
  grad_clip: 1.0
  seed: 0
  device: cuda                   # GPU-first; verification gates may override to cpu
  val_every: 5
  overfit_episodes: null

run:
  output_root: null              # optional base override (cluster scratch for pilot jobs)

rollout:
  max_ticks: 600
  success_angle_deg: 45.0
  temporal_ensemble: false
  ensemble_m: 0.01
  policy_device: cuda            # learned-policy inference runs on GPU by default

wandb: {}
