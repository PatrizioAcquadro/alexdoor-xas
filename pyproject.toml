# AlexDoor-XAS — packaging for the Phase-1 scaffold.
#
# Isaac Sim / Isaac Lab / PyTorch are provided by the official local installs
# (see docs/environment.md) and are intentionally NOT listed as dependencies
# here -- this package installs light and never pulls the sim stack.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexdoor-xas"
version = "0.1.0"
description = "Cross-Action-Space VLA/WAM learning for humanoid articulated-object manipulation (AlexDoor-XAS) — Phase 1 scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Patrizio Acquadro", email = "pacquadr@purdue.edu" }]
dependencies = [
    "hydra-core>=1.3,<1.4",
    "numpy>=1.24",
    "omegaconf>=2.3,<2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
tracking = ["wandb>=0.28,<0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/alexdoor_xas"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
